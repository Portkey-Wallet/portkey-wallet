name: EOA-Build and upload to the Chrome Web Store

on:
  push:
    tags:
      - 'eoa.ext.v.*'

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install

      - name: Run yarn extension:aelf pro
        env:
          CLIENT_ID: ${{ secrets.EOA_EXTENSTION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.EOA_EXTENSTION_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.EOA_EXTENSTION_REFRESH_TOKEN }}
          LARK_ROBOT: ${{ secrets.EOA_EXTENSTION_LARK_ROBOT }}
        run: |
          yarn extension:aelf pro:upload
